services:
  - type: web
    name: nongfo-rates
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/games
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        value: nongfo-admin-2026
      - key: ADMIN_SESSION_SECRET
        generateValue: true
